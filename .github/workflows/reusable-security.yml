# ============================================================
# Reusable Workflow — Security Scanning
# Called by: ci.yml, cd.yml
# Runs: GitLeaks, Snyk SCA, Snyk Code, npm audit
# ============================================================

name: Reusable — Security Scanning

on:
  workflow_call:
    inputs:
      services:
        description: "JSON array of service names to scan"
        required: true
        type: string
      matrix:
        description: "Matrix definition JSON"
        required: true
        type: string


permissions:
  contents: read
  security-events: write

jobs:
  # ── Snyk SCA + Code scan per service ────────────────────────────────────────
  snyk-scan:
    name: Snyk — ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix: ${{ fromJson(inputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci --prefer-offline

      - name: Authenticate Snyk
        run: npx snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Snyk SCA — dependency vulnerabilities
        id: snyk-test
        working-directory: ${{ matrix.service }}
        run: |
          npx snyk test \
            --severity-threshold=high \
            --json-file-output=snyk-sca-report.json \
            || echo "SNYK_SCA_FAILED=true" >> "$GITHUB_ENV"
        continue-on-error: true

      - name: Snyk Code — static analysis
        id: snyk-code
        working-directory: ${{ matrix.service }}
        run: |
          npx snyk code test \
            --severity-threshold=high \
            --json-file-output=snyk-code-report.json \
            || echo "SNYK_CODE_FAILED=true" >> "$GITHUB_ENV"
        continue-on-error: true

      - name: Snyk Monitor — continuous monitoring
        working-directory: ${{ matrix.service }}
        run: |
          npx snyk monitor \
            --project-name="${{ matrix.service }}" \
            --org="${{ vars.SNYK_ORG }}"
        continue-on-error: true   # Don't fail CI if monitoring upload fails

      - name: Check for critical/high vulnerabilities
        working-directory: ${{ matrix.service }}
        run: |
          SCA_FAILED="${SNYK_SCA_FAILED:-false}"
          CODE_FAILED="${SNYK_CODE_FAILED:-false}"

          echo "### 🛡️ Snyk Results — ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"

          if [ -f snyk-sca-report.json ]; then
            CRITICAL=$(jq '[.vulnerabilities[]? | select(.severity == "critical")] | length' snyk-sca-report.json 2>/dev/null || echo 0)
            HIGH=$(jq '[.vulnerabilities[]? | select(.severity == "high")] | length' snyk-sca-report.json 2>/dev/null || echo 0)
            MEDIUM=$(jq '[.vulnerabilities[]? | select(.severity == "medium")] | length' snyk-sca-report.json 2>/dev/null || echo 0)

            echo "| Severity | Count |" >> "$GITHUB_STEP_SUMMARY"
            echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| 🔴 Critical | ${CRITICAL} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| 🟠 High | ${HIGH} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| 🟡 Medium | ${MEDIUM} |" >> "$GITHUB_STEP_SUMMARY"

            if [ "$SCA_FAILED" = "true" ] || [ "$CODE_FAILED" = "true" ]; then
              echo "::error::Snyk detected critical/high vulnerabilities in ${{ matrix.service }}. Review the reports."
              exit 1
            fi
          fi

      - name: Generate combined HTML security report
        if: always()
        working-directory: ${{ matrix.service }}
        run: |
          cat > security-report.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>Security Report - ${{ matrix.service }}</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 2rem; }
              h1 { color: #1a1a2e; }
              pre { background: #f4f4f4; padding: 1rem; border-radius: 4px; overflow-x: auto; }
              .critical { color: #c0392b; }
              .high { color: #e67e22; }
            </style>
          </head>
          <body>
            <h1>🛡️ Security Report — ${{ matrix.service }}</h1>
            <p><strong>Date:</strong> $(date -u)</p>
            <p><strong>Commit:</strong> ${{ github.sha }}</p>
            <h2>Snyk SCA Results</h2>
            <pre>$(cat snyk-sca-report.json 2>/dev/null || echo "No SCA report generated")</pre>
            <h2>Snyk Code Results</h2>
            <pre>$(cat snyk-code-report.json 2>/dev/null || echo "No Code report generated")</pre>
          </body>
          </html>
          EOF

      - name: Upload Snyk reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-reports-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/snyk-sca-report.json
            ${{ matrix.service }}/snyk-code-report.json
            ${{ matrix.service }}/security-report.html
          retention-days: 30

  # ── npm audit per service ────────────────────────────────────────────────────
  npm-audit:
    name: npm audit — ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix: ${{ fromJson(inputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci --prefer-offline

      - name: Run npm audit
        working-directory: ${{ matrix.service }}
        run: |
          npm audit --audit-level=high --json > npm-audit-report.json 2>&1 || {
            EXITCODE=$?
            echo "NPM_AUDIT_FAILED=true" >> "$GITHUB_ENV"
            exit $EXITCODE
          }

      - name: Parse audit results
        if: always()
        working-directory: ${{ matrix.service }}
        run: |
          if [ -f npm-audit-report.json ]; then
            CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' npm-audit-report.json)
            HIGH=$(jq '.metadata.vulnerabilities.high // 0' npm-audit-report.json)

            echo "### 📦 npm audit — ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
            echo "| Severity | Count |" >> "$GITHUB_STEP_SUMMARY"
            echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| 🔴 Critical | ${CRITICAL} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| 🟠 High | ${HIGH} |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ matrix.service }}
          path: ${{ matrix.service }}/npm-audit-report.json
          retention-days: 30
