# ============================================================
# Reusable Workflow — Security Scanning
# Called by: ci.yml, cd.yml
# Runs: GitLeaks, Snyk SCA, Snyk Code, npm audit
# ============================================================

name: Reusable — Security Scanning

on:
  workflow_call:
    inputs:
      services:
        description: "JSON array of service names to scan"
        required: true
        type: string
      matrix:
        description: "Matrix definition JSON"
        required: true
        type: string


permissions:
  contents: read

jobs:
  # ── Snyk SCA + Code scan per service ────────────────────────────────────────
  npm-audit:
    name: npm audit — ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix: ${{ fromJson(inputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci --prefer-offline

      - name: Run npm audit
        working-directory: ${{ matrix.service }}
        run: |
          npm audit --audit-level=high --json > npm-audit-report.json 2>&1 || {
            EXITCODE=$?
            echo "NPM_AUDIT_FAILED=true" >> "$GITHUB_ENV"
            exit $EXITCODE
          }

      - name: Parse audit results
        if: always()
        working-directory: ${{ matrix.service }}
        run: |
          if [ -f npm-audit-report.json ]; then
            CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' npm-audit-report.json)
            HIGH=$(jq '.metadata.vulnerabilities.high // 0' npm-audit-report.json)

            echo "### 📦 npm audit — ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
            echo "| Severity | Count |" >> "$GITHUB_STEP_SUMMARY"
            echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| 🔴 Critical | ${CRITICAL} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| 🟠 High | ${HIGH} |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ matrix.service }}
          path: ${{ matrix.service }}/npm-audit-report.json
          retention-days: 30
